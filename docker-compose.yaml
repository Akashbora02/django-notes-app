version: "3.9"

services:

  mysql:
    image: mysql:8

    container_name: mysql_db

    restart: always

    environment:
      MYSQL_DATABASE: notesdb
      MYSQL_USER: notesuser
      MYSQL_PASSWORD: notespass
      MYSQL_ROOT_PASSWORD: rootpass

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  django:

    build: .

    container_name: django_notes

    depends_on:
      - mysql

    environment:
      DB_NAME: notesdb
      DB_USER: notesuser
      DB_PASSWORD: notespass
      DB_HOST: mysql
      DB_PORT: 3306

    command: >
      sh -c "
      sleep 20 &&
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      python manage.py runserver 0.0.0.0:8000
      "

    expose:
      - "8000"

    restart: always

  nginx:

    image: nginx:latest

    container_name: nginx_proxy

    depends_on:
      - django

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl

    restart: always


volumes:
  mysql_data:
